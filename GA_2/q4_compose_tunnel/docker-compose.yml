version: "3.8"

services:
  redis:
    image: redis:7-alpine
    networks:
      - appnet

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
